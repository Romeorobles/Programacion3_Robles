<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            color: #333;
            text-align: center;
            font-size: 3em; /* Aumenta el tamaño del encabezado */
        }

        p {
            font-size: 24px; /* Aumenta el tamaño del texto */
            line-height: 2; /* Aumenta la altura de la línea de texto */
            margin-bottom: 1em; /* Agrega un espacio entre los párrafos */
        }
    </style>
</head>
<body>
    <h1>Encabezado de la página</h1>
    <p>Este es un párrafo de ejemplo con estilos CSS ampliados.</p>
</body>
</html>
